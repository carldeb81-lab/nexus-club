<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nexus Club — 5 Salles</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --neon-pink: #ff2e88; --neon-cyan: #00e5ff; --neon-purple: #b026ff;
  --neon-green: #00ff9d; --neon-gold: #ffd400; --bg-dark: #06010f;
  --panel: rgba(20, 8, 40, 0.85); --border: rgba(176, 38, 255, 0.35);
  --ink: #f5eaff; --ink-dim: #a48ec4;
  --room-primary: #b026ff;
  --room-secondary: #ff2e88;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: var(--bg-dark); color: var(--ink); min-height: 100vh;
  font-size: 15px; overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(176,38,255,0.25), transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(255,46,136,0.2), transparent 50%);
  background-attachment: fixed;
}
.hidden { display: none !important; }
#login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem; }
.login-card {
  width: 100%; max-width: 520px; background: var(--panel);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border); border-radius: 20px; padding: 1.8rem 1.4rem;
  box-shadow: 0 0 60px rgba(176,38,255,0.35);
  animation: cardIn 0.6s ease;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: none; } }
.logo-main {
  font-size: 1.7rem; font-weight: 800; letter-spacing: 0.12em; text-align: center;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.logo-sub { text-align: center; font-size: 0.7rem; color: var(--ink-dim); letter-spacing: 0.25em; text-transform: uppercase; margin-top: 0.3rem; margin-bottom: 1.6rem; }
.field-label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-dim); margin-bottom: 0.5rem; font-weight: 600; }
#nickname { width: 100%; padding: 0.85rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); color: var(--ink); font-family: inherit; font-size: 1rem; margin-bottom: 1.2rem; }
#nickname:focus { outline: none; border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0,229,255,0.35); }
.room-picker-login { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.35rem; margin-bottom: 1.2rem; }
.room-btn-login { padding: 0.6rem 0.2rem; border-radius: 12px; border: 2px solid var(--border); background: rgba(0,0,0,0.5); color: var(--ink); font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; transition: all 0.2s; font-size: 0.55rem; font-weight: 600; }
.room-btn-login .r-emoji { font-size: 1.25rem; }
.room-btn-login:hover { transform: translateY(-2px); }
.room-btn-login.selected { transform: translateY(-2px); }
.race-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 1.2rem; max-height: 320px; overflow-y: auto; padding: 0.3rem; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.race-picker::-webkit-scrollbar { width: 6px; }
.race-picker::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.race-section-title { grid-column: 1 / -1; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--neon-cyan); font-weight: 700; padding: 0.4rem 0 0.2rem; border-bottom: 1px solid var(--border); margin-bottom: 0.3rem; }
.race-section-title.alien { color: var(--neon-pink); }
.race-section-title.ai { color: var(--neon-gold); }
.race-btn { aspect-ratio: 1; border-radius: 12px; border: 2px solid transparent; background: rgba(0,0,0,0.5); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; transition: all 0.2s; position: relative; }
.race-btn svg { width: 100%; height: 100%; display: block; }
.race-btn:hover { transform: scale(1.06); }
.race-btn.selected { border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0,229,255,0.7); background: rgba(0,229,255,0.08); }
.race-btn .race-tag { position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); font-size: 0.5rem; color: var(--ink-dim); white-space: nowrap; background: rgba(0,0,0,0.7); padding: 1px 4px; border-radius: 4px; text-transform: uppercase; font-weight: 600; }
.race-btn.selected .race-tag { color: var(--neon-cyan); }
.color-picker { display: flex; gap: 0.5rem; margin-bottom: 1.3rem; justify-content: center; flex-wrap: wrap; }
.color-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; padding: 0; }
.color-btn.selected { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 20px currentColor; }
.enter-btn { width: 100%; padding: 1rem; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple)); color: #fff; font-size: 1rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-family: inherit; cursor: pointer; box-shadow: 0 8px 30px rgba(255,46,136,0.45); }
.enter-btn:active { transform: scale(0.97); }
.login-hint { text-align: center; font-size: 0.68rem; color: var(--ink-dim); margin-top: 1rem; line-height: 1.5; }
#club-screen { min-height: 100vh; display: flex; flex-direction: column; max-width: 1100px; margin: 0 auto; padding: 0.8rem; gap: 0.6rem; }
#club-header { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0.9rem; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; backdrop-filter: blur(20px); flex-wrap: wrap; gap: 0.5rem; }
.club-logo { font-size: 0.95rem; font-weight: 800; letter-spacing: 0.15em; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.header-right { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.badge { padding: 0.35rem 0.7rem; border-radius: 20px; font-size: 0.72rem; font-weight: 600; background: rgba(0,0,0,0.5); border: 1px solid var(--border); display: flex; align-items: center; gap: 0.35rem; }
.badge svg { width: 20px; height: 20px; }
#room-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; padding: 0.4rem; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; backdrop-filter: blur(20px); }
.room-tab { position: relative; padding: 0.7rem 0.4rem; border-radius: 10px; border: 1px solid transparent; background: rgba(0,0,0,0.35); color: var(--ink); font-family: inherit; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; overflow: hidden; }
.room-tab:hover { background: rgba(0,0,0,0.55); }
.room-tab.active { background: linear-gradient(135deg, var(--tab-color-a), var(--tab-color-b)); box-shadow: 0 0 25px var(--tab-glow); border-color: rgba(255,255,255,0.15); }
.room-tab .tab-emoji { font-size: 1.2rem; line-height: 1; }
.room-tab .tab-name { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
.room-tab .tab-count { font-size: 0.55rem; color: var(--ink-dim); font-weight: 600; }
.room-tab.active .tab-count { color: rgba(255,255,255,0.9); }
.room-tab .tab-dj { position: absolute; top: 4px; right: 4px; font-size: 0.6rem; background: rgba(0,0,0,0.7); padding: 1px 5px; border-radius: 8px; animation: djBadgePulse 1.5s ease-in-out infinite; }
.room-tab .tab-playing { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; align-items: flex-end; height: 8px; }
.room-tab .tab-playing span { width: 3px; background: #fff; border-radius: 1px; animation: eqBar 0.6s ease-in-out infinite; }
.room-tab .tab-playing span:nth-child(2) { animation-delay: 0.15s; }
.room-tab .tab-playing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes eqBar { 0%, 100% { height: 3px; } 50% { height: 8px; } }
@keyframes djBadgePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
#dj-booth { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 0.8rem; backdrop-filter: blur(20px); }
.dj-empty { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap; }
.dj-empty p { font-size: 0.85rem; color: var(--ink-dim); }
.dj-empty button, .dj-controls button { padding: 0.6rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink)); color: #fff; font-family: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.dj-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
.dj-controls button.secondary { background: rgba(0,0,0,0.4); }
.dj-active-wrap { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
#yt-player-wrap { flex-shrink: 0; width: 240px; height: 135px; border-radius: 10px; overflow: hidden; background: #000; box-shadow: 0 0 30px var(--room-primary); border: 1px solid var(--border); }
#yt-player, #yt-player iframe { width: 100% !important; height: 100% !important; }
.dj-controls { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 0.5rem; }
.dj-controls input { width: 100%; padding: 0.7rem 0.85rem; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.5); color: var(--ink); font-family: inherit; font-size: 0.82rem; }
.dj-controls input:focus { outline: none; border-color: var(--neon-cyan); }
.dj-controls .btn-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.freq-presets { margin-top: 0.7rem; padding: 0.7rem; border-radius: 12px; background: rgba(192,132,252,0.08); border: 1px solid rgba(192,132,252,0.35); animation: freqIn 0.4s ease; }
@keyframes freqIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.freq-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; color: #c084fc; font-weight: 700; margin-bottom: 0.55rem; display: flex; align-items: center; gap: 0.4rem; }
.freq-buttons { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 0.4rem; }
.freq-btn { padding: 0.5rem 0.35rem; border-radius: 10px; border: 1px solid rgba(192,132,252,0.4); background: rgba(0,0,0,0.5); color: #f5eaff; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.1rem; transition: all 0.2s; }
.freq-btn:hover:not(:disabled) { background: rgba(192,132,252,0.22); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(192,132,252,0.45); }
.freq-btn:active:not(:disabled) { transform: scale(0.95); }
.freq-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.freq-btn .freq-hz { font-size: 0.85rem; font-weight: 800; color: #ffd700; line-height: 1; }
.freq-btn .freq-desc { font-size: 0.55rem; color: #a48ec4; text-align: center; line-height: 1.15; }
.freq-btn .freq-sym { font-size: 0.5rem; color: #ffd700; opacity: 0.7; font-style: italic; letter-spacing: 0.03em; line-height: 1.1; text-align: center; }
.freq-btn.playing { background: linear-gradient(135deg, #c084fc, #ffd700); border-color: #ffd700; box-shadow: 0 0 22px rgba(192,132,252,0.75); }
.freq-btn.playing .freq-hz, .freq-btn.playing .freq-desc, .freq-btn.playing .freq-sym { color: #0a0a1a; }
#main-grid { display: grid; grid-template-columns: 1fr 320px; gap: 0.7rem; flex: 1; min-height: 500px; }
#dance-floor { position: relative; border-radius: 18px; overflow: hidden; background: radial-gradient(ellipse at 50% 100%, var(--room-primary), transparent 60%), radial-gradient(ellipse at 50% 0%, var(--room-secondary), transparent 50%), #05010d; background-color: #05010d; background-blend-mode: screen; border: 1px solid var(--border); box-shadow: 0 0 60px var(--room-primary) inset; min-height: 500px; transition: background 0.6s, box-shadow 0.6s; }
#dance-floor.playing { animation: floorPulse 0.9s ease-in-out infinite; }
@keyframes floorPulse { 0%, 100% { box-shadow: 0 0 60px var(--room-primary) inset, 0 0 40px var(--room-secondary); } 50% { box-shadow: 0 0 100px var(--room-primary) inset, 0 0 80px var(--room-secondary); } }
.floor-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--room-primary) 1px, transparent 1px), linear-gradient(90deg, var(--room-primary) 1px, transparent 1px); background-size: 44px 44px; opacity: 0.55; mask-image: radial-gradient(ellipse at center, black 15%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse at center, black 15%, transparent 75%); pointer-events: none; }
#dance-floor.playing .floor-grid { animation: gridMove 1.2s linear infinite; }
@keyframes gridMove { from { background-position: 0 0, 0 0; } to { background-position: 0 44px, 44px 0; } }
.floor-spotlights { position: absolute; inset: 0; pointer-events: none; background: conic-gradient(from 0deg at 30% 20%, transparent 0deg, var(--room-secondary) 15deg, transparent 30deg), conic-gradient(from 180deg at 70% 20%, transparent 0deg, var(--room-primary) 15deg, transparent 30deg); opacity: 0.55; animation: spotSweep 8s ease-in-out infinite; }
#dance-floor.playing .floor-spotlights { animation-duration: 3s; }
@keyframes spotSweep { 0%, 100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(15deg) scale(1.1); } }
#temple-decor { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; color: #c084fc; transition: color 1.2s ease; }
#temple-decor.hidden { display: none; }
.mandala-bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, currentColor 0%, transparent 45%); opacity: 0.08; animation: mandalaBgPulse 6s ease-in-out infinite; }
@keyframes mandalaBgPulse { 0%, 100% { opacity: 0.06; transform: scale(1); } 50% { opacity: 0.16; transform: scale(1.05); } }
.mandala { position: absolute; top: 50%; left: 50%; width: 92%; max-width: 540px; aspect-ratio: 1; transform: translate(-50%, -50%); filter: drop-shadow(0 0 25px currentColor); transition: color 1.2s ease, filter 1.2s ease; }
.motif { opacity: 0; transform-origin: 200px 200px; transition: opacity 1s ease; }
.motif.active { opacity: 1; }
#motif-vesica { animation: spin 80s linear infinite; }
#motif-triquetra { animation: spinRev 70s linear infinite; }
#motif-tetraktys { animation: spin 60s linear infinite; }
#motif-fibonacci { animation: spin 120s linear infinite; }
#motif-fleur-de-vie { animation: spin 90s linear infinite; }
#motif-graine-de-vie { animation: spinRev 100s linear infinite; }
#motif-vesica-relations { animation: spin 80s linear infinite; }
#motif-merkaba { animation: spinRev 50s linear infinite; }
#motif-sri-yantra { animation: spin 70s linear infinite; }
#motif-metatron { animation: spin 110s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes spinRev { to { transform: rotate(-360deg); } }
#dance-floor.playing #temple-decor .motif.active { animation-duration: 30s !important; }
#dance-floor.playing .mandala { filter: drop-shadow(0 0 40px currentColor); }
.mandala-center { animation: centerPulse 3s ease-in-out infinite; transform-origin: 200px 200px; }
@keyframes centerPulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.22); opacity: 1; } }
#dance-floor.playing .mandala-center { animation-duration: 1.2s; }
.waves-container { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%); pointer-events: none; }
.wave { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 1.5px solid currentColor; opacity: 0.7; animation: waveExpand 4s ease-out infinite; }
@keyframes waveExpand { 0% { transform: scale(0.4); opacity: 0.85; } 100% { transform: scale(22); opacity: 0; } }
#dance-floor.playing .wave { animation-duration: 2.2s; }
.temple-hz { position: absolute; top: 1.4rem; right: 1.2rem; display: flex; flex-direction: column; align-items: flex-end; text-align: right; z-index: 6; padding: 0.5rem 0.9rem; border-radius: 14px; background: rgba(0,0,0,0.6); border: 1px solid currentColor; box-shadow: 0 0 30px currentColor; transition: border-color 1.2s, box-shadow 1.2s; backdrop-filter: blur(10px); }
.temple-hz .hz-value { font-size: 1.7rem; font-weight: 800; color: currentColor; line-height: 1; text-shadow: 0 0 20px currentColor; transition: color 1.2s; font-variant-numeric: tabular-nums; }
.temple-hz .hz-unit { font-size: 0.6rem; letter-spacing: 0.15em; color: var(--ink-dim); text-transform: uppercase; margin-top: -2px; }
.temple-hz .hz-label { font-size: 0.68rem; font-weight: 600; color: var(--ink); margin-top: 0.15rem; letter-spacing: 0.05em; }
#temple-decor.playing .temple-hz { animation: hzPulse 1.6s ease-in-out infinite; }
@keyframes hzPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.floating-particles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.floating-particles .particle { position: absolute; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; opacity: 0; animation: floatUp linear infinite; }
@keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { opacity: 0.9; } 100% { transform: translateY(-400px) scale(0.2); opacity: 0; } }
#room-indicator { position: absolute; top: 0.8rem; left: 0.9rem; padding: 0.35rem 0.75rem; border-radius: 20px; background: rgba(0,0,0,0.65); border: 1px solid var(--room-primary); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; display: flex; align-items: center; gap: 0.35rem; z-index: 5; transition: border-color 0.6s; }
#room-indicator .room-name { color: var(--room-primary); text-transform: uppercase; }
#avatars-container { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.avatar { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 0.25rem; transition: left 0.6s cubic-bezier(0.4,0,0.2,1), top 0.6s cubic-bezier(0.4,0,0.2,1), opacity 0.4s; }
.avatar-circle { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 4px; background: rgba(0,0,0,0.65); border: 2px solid; position: relative; transition: all 0.3s; }
.avatar-circle svg { width: 100%; height: 100%; display: block; }
.avatar-circle::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid; opacity: 0; transition: opacity 0.3s; }
.avatar.dancing .avatar-circle::after { opacity: 0.7; animation: ringPulse 1s ease-out infinite; }
@keyframes ringPulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.4); opacity: 0; } }
.avatar.idle .avatar-circle { animation: idleBob 3s ease-in-out infinite; }
@keyframes idleBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.avatar.dancing[data-style="bounce"] .avatar-circle { animation: danceBounce 0.55s ease-in-out infinite; }
.avatar.dancing[data-style="sway"] .avatar-circle { animation: danceSway 0.75s ease-in-out infinite; }
.avatar.dancing[data-style="spin"] .avatar-circle { animation: danceSpin 1s linear infinite; }
.avatar.dancing[data-style="headbang"] .avatar-circle { animation: danceHeadbang 0.45s ease-in-out infinite; }
.avatar.dancing[data-style="robot"] .avatar-circle { animation: danceRobot 0.7s steps(2) infinite; }
.avatar.dancing[data-style="shuffle"] .avatar-circle { animation: danceShuffle 0.5s ease-in-out infinite; }
@keyframes danceBounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(4deg); } }
@keyframes danceSway { 0%, 100% { transform: translateX(-6px) rotate(-10deg); } 50% { transform: translateX(6px) rotate(10deg); } }
@keyframes danceSpin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }
@keyframes danceHeadbang { 0%, 100% { transform: rotate(-15deg) translateY(0); } 50% { transform: rotate(15deg) translateY(-6px); } }
@keyframes danceRobot { 0% { transform: translateX(-4px) rotate(-5deg); } 100% { transform: translateX(4px) rotate(5deg); } }
@keyframes danceShuffle { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.08); } }
.avatar-name { font-size: 0.6rem; font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 10px; background: rgba(0,0,0,0.8); white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; border: 1px solid rgba(255,255,255,0.08); }
.avatar.dancing .avatar-name { background: var(--room-secondary); box-shadow: 0 0 15px var(--room-secondary); }
#chat-panel { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; backdrop-filter: blur(20px); min-height: 0; }
#chat-header { padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); flex-shrink: 0; }
#chat-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; display: flex; align-items: center; gap: 0.4rem; }
#chat-title .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--room-primary); box-shadow: 0 0 10px var(--room-primary); animation: livePulse 1.5s ease-in-out infinite; }
@keyframes livePulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
#chat-room-badge { font-size: 0.6rem; color: var(--room-primary); font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
#chat-count { font-size: 0.65rem; color: var(--ink-dim); background: rgba(0,0,0,0.5); padding: 0.15rem 0.5rem; border-radius: 10px; border: 1px solid var(--border); }
#chat-messages { flex: 1; overflow-y: auto; padding: 0.7rem; display: flex; flex-direction: column; gap: 0.55rem; scrollbar-width: thin; scrollbar-color: var(--border) transparent; min-height: 0; }
#chat-messages::-webkit-scrollbar { width: 6px; }

function buildFleurDeVie() {
  const r = 32, cx = 200, cy = 200;
  const g1 = document.getElementById('fleur-ring-1');
  const g2 = document.getElementById('fleur-ring-2');
  const g3 = document.getElementById('fleur-ring-3');
  if (!g1) return;
  const makeC = (x, y) => { const c = document.createElementNS(svgNS, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r); return c; };
  g1.appendChild(makeC(cx, cy));
  for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 - Math.PI / 2; g2.appendChild(makeC(cx + Math.cos(a) * r, cy + Math.sin(a) * r)); }
  for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2; g3.appendChild(makeC(cx + Math.cos(a) * r * 2, cy + Math.sin(a) * r * 2)); }
}

function buildGraineDeVie() {
  const r = 30, cx = 200, cy = 200;
  const g6 = document.getElementById('graine-6');
  const g12 = document.getElementById('graine-12');
  if (!g6) return;
  const makeC = (x, y, op = 1) => { const c = document.createElementNS(svgNS, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r); c.setAttribute('opacity', op); return c; };
  g6.appendChild(makeC(cx, cy));
  for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 - Math.PI / 2; g6.appendChild(makeC(cx + Math.cos(a) * r, cy + Math.sin(a) * r)); }
  for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2; g12.appendChild(makeC(cx + Math.cos(a) * r * 2, cy + Math.sin(a) * r * 2, 0.85)); }
}

function buildMetatron() {
  const r = 55, cx = 200, cy = 200;
  const gC = document.getElementById('metatron-circles');
  const gL = document.getElementById('metatron-lines');
  if (!gC) return;
  const centers = [{ x: cx, y: cy }];
  for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 - Math.PI / 2; centers.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }); }
  for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 - Math.PI / 2 + Math.PI / 6; centers.push({ x: cx + Math.cos(a) * r * 1.732, y: cy + Math.sin(a) * r * 1.732 }); }
  centers.forEach(c => { const circle = document.createElementNS(svgNS, 'circle'); circle.setAttribute('cx', c.x); circle.setAttribute('cy', c.y); circle.setAttribute('r', r); gC.appendChild(circle); });
  for (let i = 0; i < centers.length; i++) { for (let j = i + 1; j < centers.length; j++) { const line = document.createElementNS(svgNS, 'line'); line.setAttribute('x1', centers[i].x); line.setAttribute('y1', centers[i].y); line.setAttribute('x2', centers[j].x); line.setAttribute('y2', centers[j].y); gL.appendChild(line); } }
}

  const decor = document.getElementById('temple-decor');

  state.currentRoom = roomId;
  state.unreadByRoom[roomId] = 0;
  broadcast({ type: 'room-change', userId: state.user.id, room: roomId });
  applyRoomTheme();
  renderRoomTabs();
  positionAndRender();
  updateVibe();
  updateDJUI();
  updateLikeBtn();
  renderChat();
  updateUnreadBadge();
  const room = state.rooms[roomId];
  if (room.currentTrack && room.djId) loadVideo(room.currentTrack.videoId, true, 0);
  else stopVideoSilent();
  showToast(`${currentRoomDef().emoji} Salle ${currentRoomDef().name}`);
}

function applyRoomTheme() {
  const r = currentRoomDef();
  document.documentElement.style.setProperty('--room-primary', r.primary);
  document.documentElement.style.setProperty('--room-secondary', r.secondary);
  $('room-indicator').querySelector('.room-name').textContent = r.name;
  $('chat-room-badge').textContent = r.name;
  $('dj-empty-text').textContent = `🎧 Aucun DJ dans la salle ${r.name}…`;
  $('yt-url').placeholder = `Colle une URL YouTube pour la salle ${r.name}…`;
  updateTempleDecor();
  updateFreqVisibility();
}

function positionAndRender() {
  const all = Object.values(state.users).filter(u => u.room === state.currentRoom);
  const N = Math.max(all.length, 1);
  const container = $('avatars-container');
  const existing = new Map();
  container.querySelectorAll('.avatar').forEach(el => existing.set(el.dataset.id, el));
  all.forEach((u, i) => {
    const angle = (i / N) * Math.PI * 2 - Math.PI / 2;
    const rx = 34, ry = 34;
    const x = 50 + Math.cos(angle) * rx;
    const y = 50 + Math.sin(angle) * ry;
    let el = existing.get(u.id);
    if (!el) { el = document.createElement('div'); el.className = 'avatar'; el.dataset.id = u.id; container.appendChild(el); }
    const race = getRaceById(u.raceId);
    const key = u.raceId + '|' + u.name + '|' + u.color;
    if (el.dataset.key !== key) {
      el.dataset.key = key;
      el.innerHTML = `<div class="avatar-circle" style="border-color:${u.color}">${race.svg}</div><div class="avatar-name" style="color:${u.color}">${escapeHtml(u.name)}</div>`;
    }
    el.style.left = x + '%'; el.style.top = y + '%';
    const circle = el.querySelector('.avatar-circle');
    circle.style.borderColor = u.color;
    circle.style.boxShadow = u.liked ? `0 0 25px ${u.color}, 0 0 40px ${u.color}66` : 'none';
    const room = state.rooms[u.room];
    const isDancing = u.liked && room.isPlaying;
    el.classList.toggle('dancing', isDancing);
    el.classList.toggle('idle', !isDancing);
    el.dataset.style = u.danceStyle;
  });
  existing.forEach((el, id) => { const u = state.users[id]; if (!u || u.room !== state.currentRoom) el.remove(); });
}

function updateVibe() {
  const all = Object.values(state.users).filter(u => u.room === state.currentRoom);
  const room = currentRoom();
  const dancing = all.filter(u => u.liked && room.isPlaying).length;
  $('vibe-meter').querySelector('strong').textContent = dancing;
  $('vibe-total').textContent = all.length;
  const bars = $('vibe-bars');
  const total = 10;
  const on = Math.round((dancing / Math.max(all.length, 1)) * total);
  if (bars.children.length !== total) bars.innerHTML = Array.from({length: total}, (_, i) => `<span style="height:${8 + (i % 3) * 3}px"></span>`).join('');
  Array.from(bars.children).forEach((b, i) => b.classList.toggle('on', i < on));
  $('clubbers-list').innerHTML = all.map(u => {
    const dancing = u.liked && room.isPlaying;
    const race = getRaceById(u.raceId);
    return `<div class="clubber-chip${dancing ? ' dancing' : ''}" style="border-color:${dancing ? u.color : ''}" title="${escapeHtml(u.name)} — ${race.name}">${race.svg}<span>${escapeHtml(u.name)}${u.id === state.user?.id ? ' ★' : ''}</span></div>`;
  }).join('');
}

function toggleLike() {
  const room = currentRoom();
  if (!room.currentTrack || !state.user) return;
  const u = state.user;
  u.liked = !u.liked;
  if (u.liked) { u.danceStyle = rand(DANCE_STYLES); u.styleChangeAt = Date.now(); }
  broadcast({ type: 'like', userId: u.id, liked: u.liked, style: u.danceStyle, room: u.room });
  updateLikeBtn(); positionAndRender(); updateVibe();
}

function updateLikeBtn() {
  const btn = $('like-btn');
  const u = state.user;
  const room = currentRoom();
  const on = !!room.currentTrack;
  btn.disabled = !on;
  btn.classList.toggle('liked', on && u?.liked);
  $('like-icon').textContent = on && u?.liked ? '♥' : '♡';
  $('like-label').textContent = on ? (u?.liked ? 'Tu kiffes ce son' : "J'aime ce son") : "En attente d'un son…";
}

function initYTPlayer() {
  if (state.player) return;
  if (!state.ytReady || !window.YT || !window.YT.Player) { setTimeout(initYTPlayer, 200); return; }
  state.player = new YT.Player('yt-player', {
    height: '100%', width: '100%', videoId: '',
    playerVars: { autoplay: 0, controls: 1, modestbranding: 1, rel: 0, playsinline: 1 },
    events: { onReady: () => { if (state.pendingVideo) loadVideo(state.pendingVideo, false); }, onStateChange: onPlayerStateChange }
  });
}
window.onYouTubeIframeAPIReady = function () { state.ytReady = true; if (state.user) initYTPlayer(); };

function onPlayerStateChange(e) {
  const playing = (e.data === 1);
  const room = currentRoom();
  if (state.user?.id === room.djId && state.currentRoom === state.user.room) {
    room.isPlaying = playing;
    $('dance-floor').classList.toggle('playing', playing);
    const templeDecor = document.getElementById('temple-decor');
    if (templeDecor) templeDecor.classList.toggle('playing', playing);
    if (playing) {
      Object.values(state.users).forEach(u => { if (u.isNPC && u.room === state.currentRoom) { u.liked = Math.random() < 0.7; u.danceStyle = rand(DANCE_STYLES); } });
      broadcast({ type: 'room-playing', roomId: state.currentRoom, isPlaying: playing });
      positionAndRender(); updateVibe(); renderRoomTabs();
      setTimeout(() => npcSays(rand(['ambiance', state.currentRoom])), 1500);
    } else {
      broadcast({ type: 'room-playing', roomId: state.currentRoom, isPlaying: false });
      positionAndRender(); updateVibe(); renderRoomTabs();
    }
  }
}

function extractVideoId(url) {
  if (!url) return null;
  url = url.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function becomeDJ() {
  const room = currentRoom();
  if (room.djId && room.djId !== state.user.id) { showToast('Il y a déjà un DJ dans cette salle !'); return; }
  room.djId = state.user.id;
  updateDJUI(); renderRoomTabs();
  broadcast({ type: 'dj', roomId: state.currentRoom, userId: state.user.id });
  addSystemMessage(`${state.user.name} prend les platines 🎧`);
  showToast(`🎧 Tu es le DJ de la salle ${currentRoomDef().name} !`);
}

function leaveDJ() {
  const room = currentRoom();
  if (room.djId !== state.user.id) return;
  const name = state.user.name;
  room.djId = null; room.currentTrack = null; room.isPlaying = false;
  updateDJUI(); renderRoomTabs();
  broadcast({ type: 'dj', roomId: state.currentRoom, userId: null });
  broadcast({ type: 'stop', roomId: state.currentRoom });
  addSystemMessage(`${name} quitte les platines`);
}

function loadVideo(videoId, fromRemote = false, positionSec = 0) {
  const room = currentRoom();
  room.currentTrack = { videoId };
  if (!state.player) { state.pendingVideo = videoId; return; }
  state.player.loadVideoById(videoId, positionSec);
  Object.values(state.users).forEach(u => { if (u.room === state.currentRoom) { u.liked = u.isNPC ? Math.random() < 0.7 : false; u.danceStyle = rand(DANCE_STYLES); } });
  positionAndRender(); updateVibe(); updateLikeBtn(); renderRoomTabs();
  $('track-info').textContent = '♪ Son en cours — ' + videoId;
  $('track-info').classList.add('playing');
  if (state.currentRoom === 'temple') { renderFreqButtons(); updateTempleDecor(); }
  if (!fromRemote) broadcast({ type: 'track', roomId: state.currentRoom, videoId, positionSec, djId: room.djId });
}

function stopVideoSilent() {
  if (state.player && state.player.stopVideo) state.player.stopVideo();
  $('dance-floor').classList.remove('playing');
  $('track-info').textContent = 'Aucun son en cours';
  $('track-info').classList.remove('playing');
  const templeDecor = document.getElementById('temple-decor');
  if (templeDecor) templeDecor.classList.remove('playing');
  updateLikeBtn();
}

function stopVideo() {
  const room = currentRoom();
  stopVideoSilent();
  room.currentTrack = null; room.isPlaying = false;
  Object.values(state.users).forEach(u => { if (u.room === state.currentRoom) u.liked = false; });
  positionAndRender(); updateVibe(); renderRoomTabs();
}

function playTrackAsDJ() {
  const room = currentRoom();
  if (room.djId !== state.user.id) return;
  const vid = extractVideoId($('yt-url').value);
  if (!vid) { showToast('URL YouTube invalide'); return; }
  loadVideo(vid, false, 0);
  $('yt-url').value = '';
  showToast(`▶ Son lancé en salle ${currentRoomDef().name}`);
}

function updateDJUI() {
  const room = currentRoom();
  const isDJ = room.djId === state.user?.id;
  const someoneIsDJ = !!room.djId;
  $('dj-empty').classList.toggle('hidden', someoneIsDJ);
  $('dj-active').classList.toggle('hidden', !someoneIsDJ);
  if (someoneIsDJ && state.users[room.djId]) { $('dj-badge').style.display = 'flex'; $('dj-badge-name').textContent = state.users[room.djId].name + ' · ' + currentRoomDef().name; }
  else { $('dj-badge').style.display = 'none'; }
  $('play-track').disabled = !isDJ;
  $('stop-track').disabled = !isDJ;
  $('leave-dj').style.display = isDJ ? '' : 'none';
  $('yt-url').disabled = !isDJ;
  $('yt-url').placeholder = isDJ ? `Colle une URL pour la salle ${currentRoomDef().name}…` : '🔒 Seul le DJ de cette salle peut choisir';
  if (state.currentRoom === 'temple') renderFreqButtons();
}

function renderFreqButtons() {
  const container = $('freq-buttons');
  if (!container) return;
  const isTemple = state.currentRoom === 'temple';
  const room = currentRoom();
  const isDJ = room.djId === state.user?.id;
  const currentVid = room.currentTrack?.videoId;
  container.innerHTML = SACRED_FREQUENCIES.map(f => {
    const playing = currentVid === f.videoId;
    return `<button class="freq-btn${playing ? ' playing' : ''}" data-vid="${f.videoId}" ${!isDJ ? 'disabled' : ''} title="${f.sym}"><span class="freq-hz">${f.label}</span><span class="freq-desc">${f.desc}</span><span class="freq-sym">${f.sym}</span></button>`;
  }).join('');
  if (!isTemple || !isDJ) return;
  container.querySelectorAll('.freq-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const vid = btn.dataset.vid;
      const freq = SACRED_FREQUENCIES.find(f => f.videoId === vid);
      if (!freq) return;
      loadVideo(vid, false, 0);
      showToast(`✨ ${freq.label} — ${freq.desc}`);
      renderFreqButtons();
    });
  });
}

function updateFreqVisibility() {
  const el = $('freq-presets');
  if (!el) return;
  const isTemple = state.currentRoom === 'temple';
  el.classList.toggle('hidden', !isTemple);
  if (isTemple) renderFreqButtons();
}

function formatTime(ts) { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function addChatMessage(roomId, msg) {
  const room = state.rooms[roomId];
  if (!room) return;
  room.chatMessages.push(msg);
  if (room.chatMessages.length > MAX_CHAT_MESSAGES) room.chatMessages = room.chatMessages.slice(-MAX_CHAT_MESSAGES);
  if (roomId === state.currentRoom) renderChat();
}
function addSystemMessage(text) { addChatMessage(state.currentRoom, { id:'sys-'+Date.now()+Math.random(), system:true, text, ts:Date.now() }); }

function renderChat() {
  const container = $('chat-messages');
  const room = currentRoom();
  const html = room.chatMessages.map(m => {
    if (m.system) return `<div class="chat-system">${escapeHtml(m.text)}</div>`;
    const race = getRaceById(m.raceId);
    const isSelf = m.userId === state.user?.id;
    const emojiOnly = /^[\p{Emoji}\s]+$/u.test(m.text) && m.text.length <= 8;
    return `<div class="chat-msg ${isSelf ? 'self' : ''}"><div class="chat-avatar" style="border-color:${m.color}">${race.svg}</div><div class="chat-bubble-wrap"><div class="chat-name" style="color:${m.color}">${escapeHtml(m.name)}${isSelf ? ' ★' : ''}</div><div class="chat-bubble ${emojiOnly ? 'emoji-only' : ''}">${escapeHtml(m.text)}</div><div class="chat-time">${formatTime(m.ts)}</div></div></div>`;
  }).join('');
  const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;
  container.innerHTML = html;
  if (wasAtBottom) container.scrollTop = container.scrollHeight;
  $('chat-count').textContent = room.chatMessages.filter(m => !m.system).length + ' msg';
}

function sendChatMessage() {
  const input = $('chat-input');
  const text = input.value.trim();
  if (!text || !state.user) return;
  if (text.length > MAX_MESSAGE_LENGTH) { showToast('Message trop long (max ' + MAX_MESSAGE_LENGTH + ')'); return; }
  const msg = { id: 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), userId: state.user.id, name: state.user.name, raceId: state.user.raceId, color: state.user.color, text, ts: Date.now() };
  addChatMessage(state.currentRoom, msg);
  broadcast({ type: 'chat', roomId: state.currentRoom, message: msg });
  input.value = ''; input.style.height = 'auto'; input.focus();
}

function npcSays(category) {
  const npcs = Object.values(state.users).filter(u => u.isNPC && u.room === state.currentRoom);
  if (!npcs.length) return;
  const npc = rand(npcs);
  const pool = NPC_PHRASES[category] || NPC_PHRASES.ambiance;
  let text = rand(pool);
  const realUsers = Object.values(state.users).filter(u => !u.isNPC && u.room === state.currentRoom);
  if (realUsers.length && Math.random() < 0.25) text = `@${rand(realUsers).name} ` + text.toLowerCase();
  const msg = { id: 'npc-' + Date.now() + Math.random(), userId: npc.id, name: npc.name, raceId: npc.raceId, color: npc.color, text, ts: Date.now() };
  addChatMessage(state.currentRoom, msg);
  broadcast({ type: 'chat', roomId: state.currentRoom, message: msg });
}

function startNPCChatter() {
  setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    if (Math.random() < 0.35) {
      const room = currentRoom();
      const categories = ['ambiance','reactions','ambiance','questions','taquineries'];
      if (room.currentTrack && room.isPlaying) categories.push(state.currentRoom, state.currentRoom);
      npcSays(rand(categories));
    }
  }, 11000 + Math.random() * 4000);
}

function toggleChat() {
  state.chatOpen = !state.chatOpen;
  $('chat-panel').classList.toggle('open', state.chatOpen);
  if (state.chatOpen) { state.unreadByRoom[state.currentRoom] = 0; updateUnreadBadge(); setTimeout(() => { const c = $('chat-messages'); c.scrollTop = c.scrollHeight; }, 100); }
}

function updateUnreadBadge() {
  const badge = $('unread-badge');
  const total = Object.values(state.unreadByRoom).reduce((a, b) => a + b, 0);
  if (total > 0 && !state.chatOpen) { badge.textContent = total > 9 ? '9+' : total; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}

function broadcast(msg) { try { channel.postMessage(msg); } catch (e) {} }

channel.onmessage = (e) => {
  const msg = e.data;
  if (!msg || !msg.type) return;
  if (msg.userId === state.user?.id && ['like','leave','join','room-change'].includes(msg.type)) return;
  switch (msg.type) {
    case 'join': {
      if (!state.users[msg.user.id]) {
        state.users[msg.user.id] = { ...msg.user, liked:false, danceStyle:rand(DANCE_STYLES), lastSeen:Date.now(), isNPC:false };
        renderRoomTabs(); positionAndRender(); updateVibe();
        if (msg.user.room === state.currentRoom) addSystemMessage(`${msg.user.name} a rejoint la salle`);
      }
      broadcast({ type: 'state-request-response', to: msg.user.id, from: state.user?.id,
        roomsState: {
          rap: { djId: state.rooms.rap.djId, track: state.rooms.rap.currentTrack, isPlaying: state.rooms.rap.isPlaying },
          techno: { djId: state.rooms.techno.djId, track: state.rooms.techno.currentTrack, isPlaying: state.rooms.techno.isPlaying },
          rock: { djId: state.rooms.rock.djId, track: state.rooms.rock.currentTrack, isPlaying: state.rooms.rock.isPlaying },
          temple: { djId: state.rooms.temple.djId, track: state.rooms.temple.currentTrack, isPlaying: state.rooms.temple.isPlaying },
          ambiance: { djId: state.rooms.ambiance.djId, track: state.rooms.ambiance.currentTrack, isPlaying: state.rooms.ambiance.isPlaying },
        },
        users: Object.values(state.users).filter(u => !u.isNPC).map(publicUser),
        chat: { rap: state.rooms.rap.chatMessages.slice(-20), techno: state.rooms.techno.chatMessages.slice(-20), rock: state.rooms.rock.chatMessages.slice(-20), temple: state.rooms.temple.chatMessages.slice(-20), ambiance: state.rooms.ambiance.chatMessages.slice(-20) }
      });
      break;
    }
    case 'leave': {
      const u = state.users[msg.userId];
      delete state.users[msg.userId];
      if (u) { const r = state.rooms[u.room]; if (r && r.djId === msg.userId) { r.djId = null; r.currentTrack = null; r.isPlaying = false; } }
      renderRoomTabs(); positionAndRender(); updateVibe(); updateDJUI();
      if (u && u.room === state.currentRoom) addSystemMessage(`${u.name} a quitté la salle`);
      break;
    }
    case 'room-change': { const u = state.users[msg.userId]; if (!u) break; u.room = msg.room; renderRoomTabs(); positionAndRender(); updateVibe(); break; }
    case 'heartbeat': if (state.users[msg.userId]) state.users[msg.userId].lastSeen = Date.now(); break;
    case 'like':
      if (state.users[msg.userId] && msg.room === state.currentRoom) {
        state.users[msg.userId].liked = msg.liked;
        state.users[msg.userId].danceStyle = msg.style || state.users[msg.userId].danceStyle;
        positionAndRender(); updateVibe();
      }
      break;
    case 'dj': { const r = state.rooms[msg.roomId]; if (!r) break; r.djId = msg.userId; renderRoomTabs(); if (msg.roomId === state.currentRoom) updateDJUI(); break; }
    case 'track': { const r = state.rooms[msg.roomId]; if (!r) break; r.currentTrack = { videoId: msg.videoId }; r.djId = msg.djId || r.djId; renderRoomTabs(); if (msg.roomId === state.currentRoom) loadVideo(msg.videoId, true, msg.positionSec || 0); break; }
    case 'room-playing': { const r = state.rooms[msg.roomId]; if (!r) break; r.isPlaying = msg.isPlaying; renderRoomTabs(); if (msg.roomId === state.currentRoom) { $('dance-floor').classList.toggle('playing', msg.isPlaying); const td = document.getElementById('temple-decor'); if (td) td.classList.toggle('playing', msg.isPlaying); if (msg.isPlaying) { Object.values(state.users).forEach(u => { if (u.isNPC && u.room === state.currentRoom) u.liked = Math.random() < 0.7; }); positionAndRender(); updateVibe(); } } break; }
    case 'stop': { const r = state.rooms[msg.roomId]; if (!r) break; r.currentTrack = null; r.isPlaying = false; if (msg.roomId === state.currentRoom) { stopVideoSilent(); Object.values(state.users).forEach(u => { if (u.room === state.currentRoom) u.liked = false; }); positionAndRender(); updateVibe(); updateLikeBtn(); } renderRoomTabs(); break; }
    case 'chat': {
      const r = state.rooms[msg.roomId];
      if (!r) break;
      if (!r.chatMessages.some(m => m.id === msg.message.id)) {
        addChatMessage(msg.roomId, msg.message);
        if (msg.roomId !== state.currentRoom || !state.chatOpen) { state.unreadByRoom[msg.roomId] = (state.unreadByRoom[msg.roomId] || 0) + 1; updateUnreadBadge(); }
      }
      break;
    }
    case 'state-request-response':
      if (msg.to !== state.user?.id) return;
      (msg.users || []).forEach(u => { if (!state.users[u.id]) state.users[u.id] = { ...u, liked:false, danceStyle:rand(DANCE_STYLES), lastSeen:Date.now(), isNPC:false }; });
      Object.entries(msg.roomsState || {}).forEach(([rid, rs]) => { if (!state.rooms[rid]) return; if (rs.djId) state.rooms[rid].djId = rs.djId; if (rs.track) state.rooms[rid].currentTrack = rs.track; state.rooms[rid].isPlaying = !!rs.isPlaying; });
      Object.entries(msg.chat || {}).forEach(([rid, msgs]) => { if (!state.rooms[rid]) return; msgs.forEach(m => { if (!state.rooms[rid].chatMessages.some(x => x.id === m.id)) state.rooms[rid].chatMessages.push(m); }); state.rooms[rid].chatMessages.sort((a, b) => a.ts - b.ts); if (state.rooms[rid].chatMessages.length > MAX_CHAT_MESSAGES) state.rooms[rid].chatMessages = state.rooms[rid].chatMessages.slice(-MAX_CHAT_MESSAGES); });
      const myRoom = state.rooms[state.currentRoom];
      if (myRoom.currentTrack && myRoom.djId) loadVideo(myRoom.currentTrack.videoId, true, 0);
      renderRoomTabs(); positionAndRender(); updateVibe(); updateDJUI(); renderChat();
      break;
  }
};

function startHeartbeat() { setInterval(() => { if (!state.user) return; state.user.lastSeen = Date.now(); broadcast({ type: 'heartbeat', userId: state.user.id }); }, BROADCAST_HEARTBEAT); }
function startCleanupLoop() {
  setInterval(() => {
    const now = Date.now();
    let changed = false;
    Object.values(state.users).forEach(u => { if (u.isNPC || u.id === state.user?.id) return; if (now - (u.lastSeen || 0) > USER_TIMEOUT) { delete state.users[u.id]; const r = state.rooms[u.room]; if (r && r.djId === u.id) { r.djId = null; r.currentTrack = null; r.isPlaying = false; } changed = true; } });
    if (changed) { renderRoomTabs(); positionAndRender(); updateVibe(); updateDJUI(); }
  }, 5000);
}

function startNPCAnimations() {
  setInterval(() => {
    const now = Date.now(); let changed = false;
    Object.values(state.users).forEach(u => { if (!u.isNPC || !u.liked) return; const room = state.rooms[u.room]; if (!room || !room.isPlaying) return; if (now - u.styleChangeAt > 4000 + Math.random() * 3000) { u.danceStyle = rand(DANCE_STYLES); u.styleChangeAt = now; changed = true; } });
    if (changed) positionAndRender();
  }, 1500);
  setInterval(() => {
    let changed = false;
    Object.values(state.users).forEach(u => { if (!u.isNPC) return; const room = state.rooms[u.room]; if (!room || !room.isPlaying) return; if (Math.random() < 0.15) { u.liked = !u.liked; u.danceStyle = rand(DANCE_STYLES); changed = true; } });
    if (changed) { positionAndRender(); updateVibe(); }
  }, 3500);
  setInterval(() => {
    const npcs = Object.values(state.users).filter(u => u.isNPC);
